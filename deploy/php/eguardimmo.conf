[eguardimmo]
; Les documents sont écrits en 0600 : PHP-FPM, la file d'attente et le planificateur partagent le compte eg-api.
user = eg-api
group = eg-api
listen = /run/php/eguardimmo.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 11M
php_admin_value[post_max_size] = 65M
php_admin_value[max_file_uploads] = 20
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
catch_workers_output = yes
