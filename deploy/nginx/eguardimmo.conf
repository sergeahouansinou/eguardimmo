# Les jetons d'invitation, de désinscription et de téléchargement, comme les paramètres d'URL, restent hors des journaux.
map $request_uri $eg_logged_uri {
    "~^(?<eg_secret_prefix>/(?:invitation|invitation-proprietaire|invitation-locataire|transmission|api/v1/mail/unsubscribe|api/v1/recovery/downloads|api/v1/auth/email/verify|auth/email/verify))/" "$eg_secret_prefix/***";
    "~^(?<eg_plain_path>[^?]*)" $eg_plain_path;
}

log_format eg_masked '$remote_addr [$time_local] $host "$request_method $eg_logged_uri" $status $body_bytes_sent $request_time "$http_user_agent"';

# Les en-têtes des relais de la console et de SeBook ne sont transmis à l'API que depuis ce serveur.
map $remote_addr $eg_relay_key {
    127.0.0.1 $http_x_console_relay_key;
    ::1 $http_x_console_relay_key;
    default "";
}

map $remote_addr $eg_relay_ip {
    127.0.0.1 $http_x_console_client_ip;
    ::1 $http_x_console_client_ip;
    default "";
}

map $remote_addr $eg_sebook_key {
    127.0.0.1 $http_x_sebook_relay_key;
    ::1 $http_x_sebook_relay_key;
    default "";
}

map $remote_addr $eg_sebook_ip {
    127.0.0.1 $http_x_sebook_client_ip;
    ::1 $http_x_sebook_client_ip;
    default "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/eguardimmo.log eg_masked;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__;
    root /srv/eguardimmo/current/backend/public;
    index index.php;
    server_tokens off;
    access_log /var/log/nginx/eguardimmo.log eg_masked;
    # Le journal d'erreurs recopie la requête entière, jetons compris : réservé aux pannes de Nginx.
    error_log /var/log/nginx/error.log crit;
    # Jusqu'à six photos de 10 Mo dans une même requête (états des lieux).
    client_max_body_size 65m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/v1/console {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        try_files /_ /index.php?$query_string;
    }

    # /index.php/api/... atteindrait les mêmes routes sans passer par les règles ci-dessus.
    location ^~ /index.php/ {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/eguardimmo.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_CONSOLE_RELAY_KEY $eg_relay_key;
        fastcgi_param HTTP_X_CONSOLE_CLIENT_IP $eg_relay_ip;
        fastcgi_param HTTP_X_SEBOOK_RELAY_KEY $eg_sebook_key;
        fastcgi_param HTTP_X_SEBOOK_CLIENT_IP $eg_sebook_ip;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.__DOMAIN__;
    server_tokens off;
    access_log /var/log/nginx/eguardimmo.log eg_masked;
    error_log /var/log/nginx/error.log crit;
    location / {
        include snippets/eguardimmo-proxy.conf;
        proxy_pass http://127.0.0.1:3040;
    }
}

